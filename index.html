<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Theory</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="divisibility">
      <h1>Divisibility</h1>
      <p>This tool checks the divisibility of a number from 2 to 12</p>
      <div>
        <input type="number" name="divisibility1" id="num" />
        <input type="submit" name="" id="submit" />
      </div>

      <div class="divisibilityBody">
        <ul class="numList">
          <li>2</li>
          <li>3</li>
          <li>4</li>
          <li>5</li>
          <li>6</li>
          <li>7</li>
          <li>8</li>
          <li>9</li>
          <li>10</li>
          <li>11</li>
          <li>12</li>
        </ul>
        <ul class="resultList">
          <li class="check2"></li>
          <li class="check3"></li>
          <li class="check4"></li>
          <li class="check5"></li>
          <li class="check6"></li>
          <li class="check7"></li>
          <li class="check8"></li>
          <li class="check9"></li>
          <li class="check10"></li>
          <li class="check11"></li>
          <li class="check12"></li>
        </ul>
      </div>
    </div>
  </body>
</html>
